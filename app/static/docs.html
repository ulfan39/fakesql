<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FakeSQL documentation</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--ink2:#4a5a68;--line:#dfe5ea;--brand:#0f3d5e;--code:#eef3f7}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--ink2:#b3c0cb;--line:#2a3743;--brand:#5aaee3;--code:#202d38}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#0f3d5e;color:#fff;padding:16px 20px}header a{color:#fff;text-decoration:none;font-weight:700}
main{max-width:920px;margin:22px auto;padding:8px 32px 40px;background:var(--card);border:1px solid var(--line);border-radius:12px}
h1,h2,h3{line-height:1.25}h2{margin-top:2em;border-bottom:1px solid var(--line);padding-bottom:.3em}h3{margin-top:1.6em}
code{background:var(--code);padding:1px 6px;border-radius:5px;font-size:.9em}
pre{background:var(--code);padding:14px 16px;border-radius:8px;overflow-x:auto}pre code{background:none;padding:0}
table{border-collapse:collapse;display:block;overflow-x:auto}th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}th{background:var(--code)}
a{color:var(--brand)}
@media(max-width:700px){main{margin:0;border-radius:0;padding:4px 16px 30px}}
</style></head><body>
<header><a href="/">&larr; FakeSQL</a></header>
<main>{{BODY}}</main></body></html>
